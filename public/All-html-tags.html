<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <title>SkillForge — All HTML Tags</title>
</head>
<body>
    <div class="top-bar">
        <h1>SkillForge</h1>
        <p>SkillForge For All Developers</p>
    </div>
    <div class="container">
        <nav class="nav-bar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Raw-Editor.html">Raw Editor</a></li>
                <li><a href="All-html-tags.html">All HTML Tags</a></li>
                <li><a href="comment-remover.html">Comment Remover</a></li>
                <li><a href="Data-Generator.html">Data Generator</a></li>
            </ul>
        </nav>

        <div class="content">
            <h2>SkillForge All HTML Tags</h2>
            <p>This is a list of all the HTML tags and what they do.</p>

            <div class="loading" id="loading">Loading tags...</div>
            <div class="tag-list" id="tag-list"></div>
        </div>
    </div>

    <div class="popup" id="popup">
        <div class="popup-content" id="popup-content">
            <span class="close-btn" onclick="closePopup()">&times;</span>
            <h3 id="popup-title">Popup Title</h3>
            <p id="popup-description"></p>
            <hr>
            <pre id="popup-example"></pre>
        </div>
    </div>

    <script>
        async function fetchTags() {
            const loading = document.getElementById('loading');
            const tagList = document.getElementById('tag-list');
            loading.style.display = 'block';
            try {
                const response = await fetch('alltags.json');
                if (!response.ok) throw new Error('Failed to load alltags.json');
                const allTags = await response.json();
                tagList.innerHTML = '';
                allTags.forEach(({title, description, example}) => {
                    const item = document.createElement('div');
                    item.className = 'tag-item';
                    item.innerHTML = `
                        <div><p>${title}</p></div>
                        <div>
                            <button class="info-btn">Info</button>
                            <button class="copy-btn">Copy</button>
                        </div>`;
                    item.querySelector('.info-btn').addEventListener('click', ()=> showInfo(title, description, example));
                    item.querySelector('.copy-btn').addEventListener('click', ()=> { navigator.clipboard.writeText(title); alert('Copied: '+title); });
                    tagList.appendChild(item);
                });
            } catch (err) {
                console.error(err);
                tagList.innerHTML = '<p>Failed to load tags.</p>';
            } finally {
                loading.style.display = 'none';
            }
        }

        function showInfo(title, description, example) {
            const popup = document.getElementById('popup');
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-description').innerText = description;
            document.getElementById('popup-example').innerText = example;
            popup.style.display = 'flex';
        }
        function closePopup(){ document.getElementById('popup').style.display = 'none'; }

        document.addEventListener('click', (e)=>{
            const popup = document.getElementById('popup');
            const content = document.getElementById('popup-content');
            if(popup.style.display === 'flex' && !content.contains(e.target)) closePopup();
        });

        window.onload = fetchTags;
    </script>
<script src="js/ui-animations.js"></script>
</body>
</html>
