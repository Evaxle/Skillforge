<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <title>SkillForge — Comment Remover</title>
</head>
<body>
  <div class="top-bar">
    <h1>SkillForge</h1>
    <p>SkillForge For All Developers</p>
  </div>
  <div class="container">
    <nav class="nav-bar">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="Raw-Editor.html">Raw Editor</a></li>
        <li><a href="All-html-tags.html">All HTML Tags</a></li>
        <li><a href="comment-remover.html">Comment Remover</a></li>
        <li><a href="Data-Generator.html">Data Generator</a></li>
      </ul>
    </nav>

    <div class="content">
      <h2>Code Analyzer & Comment Remover</h2>
      <p>Paste code, detect language, remove comments and extract functions.</p>

      <div id="detected">Detected language: None</div>
      <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
      <button id="processBtn">Analyze & Remove Comments</button>
      <div id="output"></div>
      <button id="copyBtn" style="display:none;">Copy Clean Code</button>

      <h3>Extracted Comments</h3>
      <div id="commentsLog"></div>
      <h3>Functions Found</h3>
      <div id="functionsLog"></div>
    </div>
  </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>
    // Scoped DOM references
    const codeInput=document.getElementById('codeInput');
    const detected=document.getElementById('detected');
    const output=document.getElementById('output');
    const commentsLog=document.getElementById('commentsLog');
    const functionsLog=document.getElementById('functionsLog');
    const processBtn=document.getElementById('processBtn');
    const copyBtn=document.getElementById('copyBtn');

    function detectLanguage(code){
      try { const result=hljs.highlightAuto(code); return result.language||'plaintext'; }
      catch(e){ return 'plaintext'; }
    }

    function removeComments(code,lang){
      let regexes = [];
      switch (lang) {
        case 'javascript':
        case 'java':
        case 'c':
        case 'cpp':
        case 'csharp':
        case 'go':
        case 'kotlin':
        case 'scala':
        case 'rust':
        case 'swift':
        case 'typescript':
        case 'php':
          regexes = [/\/\/.*$/gm, new RegExp('\\/\\*[\\s\\S]*?\\*\\/','gm')];
          break;
        case 'python':
        case 'ruby':
        case 'perl':
        case 'shell':
        case 'r':
          regexes = [/#.*$/gm];
          break;
        case 'html':
        case 'xml':
          regexes = [new RegExp('<!--[\\s\\S]*?-->','gm')];
          break;
        case 'sql':
          regexes = [/--.*$/gm, new RegExp('\\/\\*[\\s\\S]*?\\*\\/','gm')];
          break;
        default:
          regexes = [/\/\/.*$/gm, new RegExp('\\/\\*[\\s\\S]*?\\*\\/','gm'), /#.*$/gm, new RegExp('<!--[\\s\\S]*?-->','gm')];
      }
      let comments=[];
      regexes.forEach(r=>{ code.replace(r,m=>{comments.push(m);return m;}); });
      let clean=code;
      regexes.forEach(r=>{ clean=clean.replace(r,''); });
      return {clean,comments};
    }

    function extractFunctionNames(code,lang){
      let names=[];
      if(['javascript','typescript','java','c','cpp','csharp','go','kotlin','scala','swift','php'].includes(lang)){
        let matches=code.match(/function\s+([a-zA-Z0-9_]+)|([a-zA-Z0-9_]+)\s*\([^)]*\)\s*\{/g)||[];
        names=matches.map(m=>{ let n=m.match(/function\s+([a-zA-Z0-9_]+)/); if(n) return n[1]; n=m.match(/^([a-zA-Z0-9_]+)/); return n?n[1]:m; });
      } else if(lang==='python' || lang==='ruby'){
        let matches=code.match(/def\s+([a-zA-Z0-9_]+)/g)||[]; names=matches.map(m=>m.replace(/def\s+/,''));
      } else if(lang==='rust'){
        let matches=code.match(/fn\s+([a-zA-Z0-9_]+)/g)||[]; names=matches.map(m=>m.replace(/fn\s+/,''));
      }
      return names;
    }

    codeInput.addEventListener('input',()=>{ const lang=detectLanguage(codeInput.value); detected.innerHTML=`Detected language: ${lang.toUpperCase()}`; });

    processBtn.addEventListener('click',()=>{
      const code=codeInput.value; const lang=detectLanguage(code);
      const {clean,comments}=removeComments(code,lang);
      output.textContent=clean.trim(); commentsLog.textContent=comments.join('\n')||'None';
      const funcs=extractFunctionNames(code,lang); functionsLog.textContent=funcs.join('\n')||'None';
      copyBtn.style.display='inline-block';
    });

    copyBtn.addEventListener('click',()=>{ navigator.clipboard.writeText(output.textContent); });
    </script>
<script src="js/ui-animations.js"></script>
</body>
</html>
