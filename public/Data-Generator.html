<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
    <title>SkillForge — Data Generator</title>
</head>
<body>
    <div class="top-bar">
        <h1>SkillForge</h1>
        <p>SkillForge For All Developers</p>
    </div>
    <div class="container">
        <nav class="nav-bar">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="Raw-Editor.html">Raw Editor</a></li>
                <li><a href="All-html-tags.html">All HTML Tags</a></li>
                <li><a href="comment-remover.html">Comment Remover</a></li>
                <li><a href="Data-Generator.html">Data Generator</a></li>
            </ul>
        </nav>

        <div class="content">
            <h2>Data URL Generator</h2>
            <p>Enter your HTML code below to create a data URL.</p>

            <div style="margin-bottom:8px;">
                <button id="pasteBtn">Paste</button>
                <input type="file" id="fileInput" accept=".txt,.html">
            </div>
            <textarea id="htmlCode"></textarea>
            <div class="data-url-container"><p id="dataUrl" class="data-url"></p></div>
            <div style="text-align:center;margin-top:8px;">
                <button id="copyButton" disabled>Copy</button>
                <button id="saveButton">Save</button>
            </div>
        </div>
    </div>

    <script>
    const htmlCode = document.getElementById('htmlCode');
    const dataUrlP = document.getElementById('dataUrl');
    const copyButton = document.getElementById('copyButton');
    const fileInput = document.getElementById('fileInput');
    const pasteBtn = document.getElementById('pasteBtn');
    const saveButton = document.getElementById('saveButton');

    function generateDataUrl() {
        const encodedHtml = encodeURIComponent(htmlCode.value);
        const dataUrl = 'data:text/html;charset=utf-8,' + encodedHtml;
        dataUrlP.innerText = dataUrl;
        copyButton.disabled = false;
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(dataUrlP.innerText).then(()=> alert('Data URL copied to clipboard!'))
            .catch(()=> alert('Failed to copy'));
    }

    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            htmlCode.value = text; generateDataUrl();
        } catch (err) { alert('Failed to paste from clipboard'); }
    }

    function handleFileUpload() {
        const file = fileInput.files[0]; if (!file) return;
        const reader = new FileReader(); reader.onload = e=>{ htmlCode.value = e.target.result; generateDataUrl(); }; reader.readAsText(file);
    }

    function saveDataUrl() {
        const blob = new Blob([dataUrlP.innerText], { type: 'text/plain' });
        const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'data-url.txt'; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    }

    pasteBtn.addEventListener('click', pasteFromClipboard);
    fileInput.addEventListener('change', handleFileUpload);
    htmlCode.addEventListener('input', generateDataUrl);
    copyButton.addEventListener('click', copyToClipboard);
    saveButton.addEventListener('click', saveDataUrl);
    </script>

<script src="js/ui-animations.js"></script>

</body>
</html>
